name: Pixel64 paraLLEl-RDP bridge

on:
  workflow_dispatch:
  push:
    paths:
      - "native/PixelDeck.ParallelRdp/**"
      - "src/PixelDeck.Emulation.N64/Fast3dRenderer.RdpTrace.cs"
      - "src/PixelDeck.Emulation.N64/Fast3dRenderer.cs"
      - "src/PixelDeck.Emulation.N64/N64Machine.cs"
      - "src/PixelDeck.Emulation.N64/N64RdpTriangleEncoder.cs"
      - "src/PixelDeck.Emulation.N64/ParallelRdpGraphicsBackend.cs"
      - "src/PixelDeck.Emulation.N64/ParallelRdpNative.cs"
      - "src/PixelDeck.Emulation.N64/ParallelRdpSupport.cs"
      - "src/PixelDeck.Emulation.N64/ParallelRdpValidation.cs"
      - "src/PixelDeck.Emulation.N64/PixelDeck.Emulation.N64.csproj"
      - "tests/PixelDeck.App.Tests/N64RdpTriangleEncoderTests.cs"
      - "tests/PixelDeck.App.Tests/N64ParallelRdpCertificationTests.cs"
      - "tests/PixelDeck.App.Tests/ParallelRdpSupportTests.cs"
      - "tests/PixelDeck.App.Tests/ProductVersionTests.cs"
      - ".github/workflows/pixel64-parallel-rdp.yml"
  pull_request:
    paths:
      - "native/PixelDeck.ParallelRdp/**"
      - "src/PixelDeck.Emulation.N64/Fast3dRenderer.RdpTrace.cs"
      - "src/PixelDeck.Emulation.N64/Fast3dRenderer.cs"
      - "src/PixelDeck.Emulation.N64/N64Machine.cs"
      - "src/PixelDeck.Emulation.N64/N64RdpTriangleEncoder.cs"
      - "src/PixelDeck.Emulation.N64/ParallelRdpGraphicsBackend.cs"
      - "src/PixelDeck.Emulation.N64/ParallelRdpNative.cs"
      - "src/PixelDeck.Emulation.N64/ParallelRdpSupport.cs"
      - "src/PixelDeck.Emulation.N64/ParallelRdpValidation.cs"
      - "src/PixelDeck.Emulation.N64/PixelDeck.Emulation.N64.csproj"
      - "tests/PixelDeck.App.Tests/N64RdpTriangleEncoderTests.cs"
      - "tests/PixelDeck.App.Tests/N64ParallelRdpCertificationTests.cs"
      - "tests/PixelDeck.App.Tests/ParallelRdpSupportTests.cs"
      - "tests/PixelDeck.App.Tests/ProductVersionTests.cs"
      - ".github/workflows/pixel64-parallel-rdp.yml"

jobs:
  native-bridge:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build: windows-x64
            rid: win-x64
            configure_args: "-A x64"
            library: artifacts/native/win-x64/bin/PixelDeck.ParallelRdp.dll
          - os: ubuntu-latest
            build: linux-x64
            rid: linux-x64
            configure_args: ""
            library: artifacts/native/linux-x64/lib/libPixelDeck.ParallelRdp.so
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install deterministic CPU Vulkan runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libvulkan1 mesa-vulkan-drivers

      - name: Configure pinned native bridge
        run: >-
          cmake
          -S native/PixelDeck.ParallelRdp
          -B artifacts/validation/${{ matrix.build }}
          -DCMAKE_BUILD_TYPE=Release
          ${{ matrix.configure_args }}

      # Limit concurrency deliberately. slangmosh.hpp embeds the compute
      # shaders and individual compiler processes can use substantial memory.
      - name: Compile native bridge
        run: >-
          cmake
          --build artifacts/validation/${{ matrix.build }}
          --config Release
          --parallel 2

      - name: Run native ABI smoke test
        run: >-
          ctest
          --test-dir artifacts/validation/${{ matrix.build }}
          -C Release
          --output-on-failure

      - name: Stage native runtime
        run: >-
          cmake
          --install artifacts/validation/${{ matrix.build }}
          --config Release
          --prefix artifacts/native/${{ matrix.rid }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Validate managed ABI loader and fallback
        env:
          PIXELDECK_PARALLEL_RDP_LIBRARY: ${{ matrix.library }}
        run: >-
          dotnet test tests/PixelDeck.App.Tests/PixelDeck.App.Tests.csproj
          --filter "FullyQualifiedName~ParallelRdpSupportTests|FullyQualifiedName~N64RdpTriangleEncoderTests|FullyQualifiedName~ProductVersionTests"

      - name: Require native framebuffer, depth, and coverage replay
        if: runner.os == 'Linux'
        env:
          PIXELDECK_PARALLEL_RDP_LIBRARY: ${{ matrix.library }}
          PIXELDECK_REQUIRE_PARALLEL_RDP_REPLAY: "1"
        run: >-
          dotnet test tests/PixelDeck.App.Tests/PixelDeck.App.Tests.csproj
          --no-restore
          --filter "FullyQualifiedName~NativeTriangleReplayChangesColorDepthAndCoverageWhenRequired|FullyQualifiedName~NativeSequenceCarriesHiddenCoverageAcrossTasksWhenRequired"

      - name: Upload tested native runtime
        uses: actions/upload-artifact@v6
        with:
          name: PixelDeck-ParallelRdp-${{ matrix.rid }}
          path: artifacts/native/${{ matrix.rid }}
          if-no-files-found: error
